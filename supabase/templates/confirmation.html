<h2>Logg inn i Humanframe</h2>
<p>Klikk lenken for å logge inn:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Logg inn</a></p>
<p>Eller skriv inn denne koden på innloggingssiden:</p>
<p style="font-size:24px;letter-spacing:4px;font-weight:600">{{ .Token }}</p>
<p>Koden og lenken er gyldige i én time. Ba du ikke om dette, kan du se bort fra e-posten.</p>
